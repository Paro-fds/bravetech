# Configuration Alembic (US-023), pour la ligne de commande depuis la racine du dépôt :
#   alembic -c backend/alembic.ini revision --autogenerate -m "description"
# Au démarrage du conteneur, les migrations passent par `python -m backend.scripts.migrer` (backend/dal/schema.py).
# L'adresse de la base vient de DATABASE_URL (backend/dal/database.py), jamais de ce fichier.

[alembic]
script_location = %(here)s/dal/migrations
prepend_sys_path = %(here)s/..
file_template = %%(rev)s_%%(slug)s
