[project]
name = "{{SERVICE_NAME}}"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.19",
    "pydantic[email]>=2.13",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.2",
    "structlog>=25.1",
    # Add service-specific deps here (e.g. "pyjwt>=2.13" if this service
    # issues/validates JWTs) — check its own CLAUDE.md tech stack table.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
