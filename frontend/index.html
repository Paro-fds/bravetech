<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Icônes tirées du logo de la FDS (public/logo-fds.png) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#01346d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Portail officiel d'admission et de consultation des cursus académiques de la Faculté des Sciences de l'Université d'État d'Haïti (FDS-UEH)." />
    <title>Faculté des Sciences - FDS-UEH | Portail des Inscriptions & Cursus</title>
    <script>
      // US-017 : pose le thème avant le premier affichage (évite un éclair clair en mode sombre).
      // Même règle que src/shared/theme/theme.ts : choix mémorisé, sinon préférence système.
      (function () {
        var choix = null;
        try { choix = localStorage.getItem('fds-theme'); } catch (e) {}
        if (choix !== 'clair' && choix !== 'sombre') {
          choix = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'sombre' : 'clair';
        }
        document.documentElement.setAttribute('data-theme', choix === 'sombre' ? 'dark' : 'light');
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
