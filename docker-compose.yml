services:
  db:
    image: postgres:15-alpine
    container_name: fds_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fds_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fds_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fds_portail}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fds_admin} -d ${POSTGRES_DB:-fds_portail}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fds_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fds_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fds_admin}:${POSTGRES_PASSWORD:-fds_secret_pass}@db:5432/${POSTGRES_DB:-fds_portail}
      ENVIRONMENT: production
      UPLOAD_DIR: /app/uploads
      # Email de confirmation (US-008) : sans RESEND_API_KEY, les emails sont écrits dans les journaux
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      # false : plus aucun email (ni réel, ni dans les journaux). Par défaut : activé.
      EMAIL_ENABLED: "${EMAIL_ENABLED:-true}"
      # Adresse du secrétariat qui reçoit le formulaire de contact (US-019). Vide : le formulaire répond « indisponible ».
      CONTACT_EMAIL: "${CONTACT_EMAIL:-}"
      # Session du personnel (US-011) : secret de 32 caractères minimum, sans quoi la connexion admin est désactivée
      JWT_SECRET: "${JWT_SECRET:-}"
      EMAIL_FROM: "${EMAIL_FROM:-FDS Portail <onboarding@resend.dev>}"
      # URL publique du portail, utilisée pour le lien de suivi des emails
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost}"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - fds_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fds_frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - fds_network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  fds_network:
    driver: bridge
